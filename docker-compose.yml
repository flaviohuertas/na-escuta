services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: naescuta
      POSTGRES_PASSWORD: naescuta_dev_password
      POSTGRES_DB: naescuta
    ports:
      - "5432:5432"
    volumes:
      - naescuta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naescuta -d naescuta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naescuta_postgres_data:
